<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1532">
<title>SAET Bienestar · Agenda Territorial</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g900:#4A0E22;--g800:#5B1029;--g700:#6B1532;--g600:#82203F;--g400:#B56A82;--g200:#E8CBD4;--g100:#F5E6EA;--g50:#FBF4F6;
--oro:#B48A4E;--oro2:#EBDDC3;--crema:#F7F2EC;--blanco:#fff;--tinta:#3A1420;--mute:#8B737A;--linea:#EEE3E2;
--ok:#2F7D5D;--okb:#E3F2EB;--warn:#A9741A;--warnb:#FBF0D9;--bad:#B3312B;--badb:#FBE6E4;--info:#7A4B8C;--infob:#F1E8F5;
--r:20px;--sombra:0 10px 30px -18px rgba(74,14,34,.35)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tinta);background:var(--crema);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--g700)}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

/* ── Estructura ── */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.side{background:linear-gradient(175deg,var(--g700),var(--g900));color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;border-radius:0 28px 28px 0;z-index:30}
.marca{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.marca img{width:42px;height:42px;border-radius:13px;box-shadow:0 0 0 1px rgba(235,221,195,.35)}
.marca b{font-family:'Fraunces',serif;font-size:19px;letter-spacing:.02em;display:block;line-height:1.05;white-space:nowrap}
.marca span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro2);opacity:.85}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:#F3DDE3;font-weight:500;width:100%;text-align:left;transition:.15s}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:#fff;color:var(--g700);font-weight:700;box-shadow:0 8px 18px -10px rgba(0,0,0,.4)}
.nav .cnt{margin-left:auto;background:var(--oro);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px}
.side .pie{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.main{padding:22px 28px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.top h1{font-size:26px;flex:1;min-width:0}
.top .yo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:40px;padding:5px 14px 5px 5px;box-shadow:var(--sombra)}
.top .yo small{display:block;color:var(--mute);font-size:11px}
#btnMenu{display:none;width:42px;height:42px;border-radius:13px;background:#fff;box-shadow:var(--sombra);align-items:center;justify-content:center;color:var(--g700)}
#velo{display:none}

/* ── Piezas ── */
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sombra)}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .der{margin-left:auto;font:500 12px 'Plus Jakarta Sans';color:var(--mute)}
.grid{display:grid;gap:18px}
.dash{grid-template-columns:minmax(0,1fr) 310px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;background:var(--g700);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--g600)}
.btn.sec{background:var(--g100);color:var(--g700)}.btn.sec:hover{background:var(--g200)}
.btn.oro{background:var(--oro);color:#fff}.btn.blanco{background:#fff;color:var(--g700)}
.btn.ch{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--badb);color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--g100);color:var(--g700);white-space:nowrap}
.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.b-Pendiente{background:var(--warnb);color:var(--warn)}.b-Vencida,.b-Rechazada,.b-Baja{background:var(--badb);color:var(--bad)}
.b-Validada,.b-Activo{background:var(--okb);color:var(--ok)}.b-Conevidencia,.b-Porvalidar{background:var(--infob);color:var(--info)}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;background:var(--g100);color:var(--g700);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--g200)}
.av.g{width:64px;height:64px;font-size:20px}.av.xg{width:96px;height:96px;font-size:30px}
.mute{color:var(--mute)}.sm{font-size:12.5px}.fila{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{flex:1}
input,select,textarea{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--g400);box-shadow:0 0 0 4px var(--g50)}
label{font-size:12px;font-weight:600;color:var(--g800);display:block;margin:0 0 5px 2px}
.campo{margin-bottom:13px}.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filtros input,.filtros select{width:auto;min-width:150px;flex:0 1 210px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;font-weight:600}
td{padding:11px 10px;border-top:1px solid var(--linea);vertical-align:middle}
.tabla{overflow-x:auto}
.vacio{text-align:center;padding:34px 10px;color:var(--mute)}

/* ── Inicio ── */
.hero{background:linear-gradient(120deg,var(--g700),var(--g900));color:#fff;border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden}
.hero h2{font-size:27px;margin-bottom:6px}.hero p{color:#F1D9E0;max-width:520px}
.hero .btn{margin-top:16px}
.hero svg.deco{position:absolute;right:-10px;bottom:-30px;width:230px;height:230px;opacity:.16;stroke:var(--oro2);fill:none;stroke-width:1.1;stroke-linecap:round}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sombra);display:flex;gap:13px;align-items:center}
.tile i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--g100);color:var(--g700);flex:none}
.tile:nth-child(2) i{background:var(--okb);color:var(--ok)}.tile:nth-child(3) i{background:var(--warnb);color:var(--warn)}.tile:nth-child(4) i{background:#F3EADB;color:var(--oro)}
.tile b{font-family:'Fraunces',serif;font-size:25px;line-height:1;display:block}.tile span{font-size:12px;color:var(--mute)}
.barra{height:8px;border-radius:8px;background:var(--g100);overflow:hidden;min-width:90px}
.barra i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--g600),var(--oro))}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{background:var(--g50);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:var(--mute)}
.dia b{display:block;font-size:16px;color:var(--tinta);font-family:'Fraunces',serif}
.dia.hoy{background:var(--g700);color:var(--oro2)}.dia.hoy b{color:#fff}
.dia em{font-style:normal;font-weight:700;color:var(--g700);font-size:10.5px}.dia.hoy em{color:var(--oro2)}
.item{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.item:first-of-type{border-top:0}
.item .t{font-weight:600;line-height:1.25}.item .s{font-size:12px;color:var(--mute)}

/* ── Agenda ── */
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.col{background:#fff;border-radius:16px;padding:10px;min-height:260px;box-shadow:var(--sombra)}
.col header{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:2px 4px 9px;display:flex;justify-content:space-between;align-items:baseline}
.col header b{font-family:'Fraunces',serif;font-size:19px;color:var(--tinta);letter-spacing:0}
.col.hoy{box-shadow:0 0 0 2px var(--g700),var(--sombra)}.col.hoy header b{color:var(--g700)}
.chip{display:block;width:100%;text-align:left;background:var(--g50);border-left:3px solid var(--warn);border-radius:10px;padding:7px 9px;margin-bottom:7px;font-size:12px;transition:.12s}
.chip:hover{transform:translateY(-1px);background:var(--g100)}
.chip b{display:block;font-weight:600;line-height:1.25}.chip span{color:var(--mute);font-size:11px}
.chip.e-Validada{border-color:var(--ok)}.chip.e-Vencida,.chip.e-Rechazada{border-color:var(--bad)}.chip.e-Conevidencia{border-color:var(--info)}
.mas{font-size:11.5px;color:var(--g700);font-weight:600;padding:3px 6px}

/* ── Tarjetas ── */
.tarjetas{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tarea{display:flex;flex-direction:column;gap:9px}
.tarea h4{font-size:15.5px;font-weight:700;line-height:1.25}
.meta{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12.5px}
.foto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--g100);cursor:zoom-in}
.minis{display:flex;gap:8px;flex-wrap:wrap}.minis img{width:74px;height:74px;border-radius:12px;object-fit:cover;cursor:zoom-in}
.persona{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.persona h4{font-size:14.5px;font-weight:700}
.redes a{display:inline-flex;width:30px;height:30px;border-radius:9px;background:var(--g100);align-items:center;justify-content:center;margin:0 2px}
.tabs{display:inline-flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--sombra)}
.tabs button{padding:8px 15px;border-radius:11px;font-weight:600;color:var(--mute)}.tabs button.on{background:var(--g700);color:#fff}
.lista{max-height:230px;overflow:auto;border:1.5px solid var(--linea);border-radius:12px;padding:4px}
.lista label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;font-weight:500;margin:0;font-size:13px;color:var(--tinta);cursor:pointer}
.lista label:hover{background:var(--g50)}.lista input{width:auto}
.ia{background:linear-gradient(135deg,#FBF4F6,#F6EEDF);border:1.5px dashed var(--oro);border-radius:16px;padding:14px}
.visita{background:var(--g50);border-radius:14px;padding:13px;margin-bottom:10px;position:relative}
.visita .x{position:absolute;right:8px;top:8px;color:var(--bad)}

/* ── Modal / acceso ── */
#modal{position:fixed;inset:0;background:rgba(74,14,34,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:60}
.caja{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:560px;position:relative;box-shadow:0 30px 60px -20px rgba(74,14,34,.5)}
.caja h2{font-size:21px;margin-bottom:14px;padding-right:34px}
.caja .cerrar{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;background:var(--g50);color:var(--g700);display:flex;align-items:center;justify-content:center}
#luz{position:fixed;inset:0;background:rgba(74,14,34,.88);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#luz img{max-width:100%;max-height:100%;border-radius:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--g800);color:#fff;padding:12px 20px;border-radius:14px;z-index:99;box-shadow:var(--sombra);max-width:90vw;font-weight:500}
#acceso{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
.portada{background:linear-gradient(160deg,var(--g700),var(--g900));color:#fff;padding:54px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.portada h1{font-size:46px;line-height:1.05;max-width:440px}.portada p{color:#F1D9E0;max-width:400px;margin-top:14px;font-size:15px}
.portada svg.deco{position:absolute;right:-70px;bottom:-90px;width:520px;height:520px;opacity:.13;stroke:var(--oro2);fill:none;stroke-width:.9;stroke-linecap:round}
.forma{display:flex;align-items:center;justify-content:center;padding:34px 22px;overflow:auto}
.forma>div{width:100%;max-width:380px}
.forma h2{font-size:27px;margin-bottom:4px}
.demo{margin-top:20px;padding:14px;border-radius:16px;background:var(--g50);border:1.5px dashed var(--g200)}
.carga{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

@media(max-width:1100px){.dash{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.semana{grid-template-columns:1fr}.col{min-height:0}}
@media(max-width:820px){
 #app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;width:264px;transform:translateX(-105%);transition:.25s}
 .side.abierto{transform:none}
 #velo.abierto{display:block;position:fixed;inset:0;background:rgba(74,14,34,.4);z-index:25}
 #btnMenu{display:flex}.main{padding:14px 14px 40px}.top h1{font-size:21px}.top .yo div{display:none}.top .yo{padding:4px}
 #acceso{grid-template-columns:1fr}.portada{padding:30px 24px}.portada h1{font-size:30px}.portada .lema{display:none}
 .dos{grid-template-columns:1fr}.hero{padding:20px}.hero h2{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="modal" class="hide"></div>
<div id="luz" class="hide" onclick="this.classList.add('hide')"><img alt="Foto ampliada"></div>
<div id="toast" class="hide"></div>

<script>
/* ═══════════ CONFIGURACIÓN ═══════════
   Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec).
   Si la dejas vacía, la app abre en MODO DEMO con datos de ejemplo. */
const API_URL = 'https://script.google.com/macros/s/AKfycbyi8Rduw6J6wFMUkF-0VqcpePwPw7v9B0-qlLQltZMTp1Xho87aBThmYuf4ijOu7d6eBg/exec';

const NOMBRE = 'SAET Bienestar', LEMA = 'Agenda Territorial', SIGLA = 'Sistema de Agenda y Evidencias Territoriales';
const DEMO = !API_URL;
const LOGO = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E %3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%238A1F45%22/%3E%3Cstop offset=%221%22 stop-color=%22%234F0E25%22/%3E%3C/linearGradient%3E%3C/defs%3E %3Crect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22url%28%23g%29%22/%3E %3Cg fill=%22none%22 stroke=%22%23EBDDC3%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M32 52V31%22 stroke-width=%224.5%22/%3E %3Cpath d=%22M32 36c0-9-9-8-16-15M32 33c-1-8-5-12-8-19M32 32V11M32 33c1-8 5-12 8-19M32 36c0-9 9-8 16-15%22 stroke-width=%222.6%22/%3E %3Cpath d=%22M21 52h22%22 stroke-width=%222.6%22/%3E %3C/g%3E %3Cg fill=%22%23C9A56A%22%3E%3Ccircle cx=%2216%22 cy=%2221%22 r=%223.6%22/%3E%3Ccircle cx=%2224%22 cy=%2213.5%22 r=%223.6%22/%3E%3Ccircle cx=%2232%22 cy=%2210.5%22 r=%223.6%22/%3E%3Ccircle cx=%2240%22 cy=%2213.5%22 r=%223.6%22/%3E%3Ccircle cx=%2248%22 cy=%2221%22 r=%223.6%22/%3E%3C/g%3E %3C/svg%3E ";
const TIPOS = ['Visita domiciliaria','Asamblea informativa','Operativo de pago','Módulo de atención','Censo / registro','Reunión de trabajo','Difusión','Capacitación','Otra'];
const PROGRAMAS = ['Pensión Adultos Mayores','Pensión Mujeres Bienestar','Pensión Personas con Discapacidad','Becas','Jóvenes Construyendo el Futuro','Sembrando Vida','Salud Casa por Casa','Otro'];
const RESULTADOS = ['Atendida','No se encontró a la persona','Requiere seguimiento','Canalizada','Domicilio no localizado'];
const ROL = {admin:'Administrador',regional:'Regional',encargado:'Encargado',monitor:'Monitor',servidor:'Servidor de la Nación'};
const S = {user:null,token:null,zonas:[],personal:[],acts:[],evs:[],vis:[],vista:'inicio',semana:null,rango:null,f:{},tab:'Pendientes',cola:[],clave:''};

/* ═══════════ Utilidades ═══════════ */
const $ = (s,r=document)=>r.querySelector(s);
const val = id => ($('#'+id)?.value||'').trim();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mas = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const lunes = d=>{const x=new Date(d);x.setHours(12,0,0,0);return mas(x,-((x.getDay()+6)%7))};
const hoy = ()=>iso(new Date());
const fechaTxt = s=>{const d=new Date(s.slice(0,10)+'T12:00');return d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})};
const jefe = ()=>['admin','regional','encargado'].includes(S.user.rol);
const estado = a => a.estatus==='Pendiente'&&a.fecha<hoy()?'Vencida':a.estatus;
const cls = s=>String(s).replace(/\s/g,'');
const badge = s=>`<span class="badge b-${cls(s)}">${esc(s)}</span>`;
const iniciales = n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const foto = u=>{if(!u||u.startsWith('data:'))return u;const m=u.match(/\/d\/([\w-]+)/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`:u};
const avatar = (p,c='')=>p&&p.selfie?`<img class="av ${c}" src="${esc(foto(p.selfie))}" alt="" onclick="ampliar(this.src)">`:`<span class="av ${c}">${esc(iniciales(p&&p.nombre))}</span>`;
const persona = id=>S.personal.find(p=>p.id===id);
const P = {
 inicio:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 agenda:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 tareas:'<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/>',
 evidencias:'<rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/>',
 visitas:'<path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>',
 personal:'<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.6-3.600 3.200-5.500 6.500-5.500s5.900 1.900 6.500 5.500M16 4.800a3.500 3.500 0 010 6.400M18 14.800c2 .7 3.200 2.400 3.600 5.200"/>',
 monitores:'<path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

async function ocupado(btn,f){const h=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="carga"></span> Un momento…'}
 try{await f()}catch(e){if(e.message==='SESION'){salir();toast('Tu sesión terminó. Entra de nuevo.')}else toast(e.message||'Ocurrió un error')}
 finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=h}}}
function comprimir(file,max=1280,q=.72){return new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
 img.onerror=()=>no(new Error('No se pudo leer la imagen'));img.src=url})}

async function api(accion,datos={},ms=45000){
 if(DEMO) return demoApi(accion,datos);
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);let j;
 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion,token:S.token,datos}),signal:ctl.signal});j=await r.json()}
 catch(e){const x=new Error('Sin conexión con el servidor. Revisa tu señal e intenta de nuevo.');x.red=true;throw x}
 finally{clearTimeout(t)}
 if(!j.ok) throw new Error(j.error); return j.data;
}
const rangoDe=c=>({desde:iso(mas(c,-49)),hasta:iso(mas(c,56))});
/* Recibe los datos del servidor, los deja en memoria y guarda copia local para que la app abra al instante. */
function aplicar(d){
 Object.assign(S,{user:d.usuario,zonas:d.zonas,personal:d.personal,acts:d.actividades,evs:d.evidencias,vis:d.visitas,clave:d.claveRegistro||''});
 try{localStorage.setItem('ceiba_c',JSON.stringify({r:S.rango,d}))}catch(e){try{localStorage.removeItem('ceiba_c')}catch(_){}}
 aplicarCola();
}

async function refrescar(){await cargar();pintar()}
/* Actualización silenciosa en segundo plano: no interrumpe si hay una ventana abierta o se está escribiendo. */
let sincronizando=false;
async function sync(){
 if(!S.user||sincronizando) return; sincronizando=true;
 try{await cargar();const ae=document.activeElement;if(S.user&&$('#modal').classList.contains('hide')&&!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))pintar()}
 catch(e){if(e.message==='SESION'){salir();toast('Tu sesión terminó. Entra de nuevo.')}}
 finally{sincronizando=false}
}

const fondo=p=>p.then(()=>{},e=>{toast(e.message==='SESION'?'Tu sesión terminó. Entra de nuevo.':e.message);e.message==='SESION'?salir():sync()});

/* ── Cola de evidencias: si no hay señal se guardan en el teléfono y se envían solas ── */
const cola={db:null,
 abrir(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('ceiba',1);r.onupgradeneeded=()=>r.result.createObjectStore('cola',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
 async op(modo,f){const db=await this.abrir();return new Promise((ok,no)=>{const tx=db.transaction('cola',modo),q=f(tx.objectStore('cola'));tx.oncomplete=()=>ok(q&&q.result);tx.onerror=tx.onabort=()=>no(tx.error)})},
 poner(x){return this.op('readwrite',s=>s.put(x))},quitar(id){return this.op('readwrite',s=>s.delete(id))},todos(){return this.op('readonly',s=>s.getAll())}};
const miCola=()=>S.user?S.cola.filter(x=>x.uid===S.user.id):[];
function aplicarCola(){miCola().forEach(x=>{const a=S.acts.find(y=>y.id===x.actividadId);
 if(!a||S.evs.some(e=>e.id===x.id)||!['Pendiente','Rechazada'].includes(a.estatus)) return;
 a.estatus='Con evidencia';
 S.evs.push({id:x.id,actividadId:a.id,usuarioId:S.user.id,usuarioNombre:S.user.nombre,region:a.region,zona:a.zona,fecha:x.cuando,fotos:x.fotos.join(' | '),comentario:x.comentario,lat:String(x.lat),lng:String(x.lng),validacion:'Por validar',validadoPor:'',nota:'',ia:''})})}
function pintarCola(){const el=$('#colaInd');if(!el)return;const n=miCola().length;el.textContent=n+' por enviar';el.classList.toggle('hide',!n)}
let enviando=false;
async function procesarCola(){
 if(DEMO||enviando||!S.user) return; enviando=true;let enviadas=0;
 try{S.cola=await cola.todos();
  if(miCola().length){aplicarCola();if($('#modal').classList.contains('hide'))pintar()}
  for(const x of miCola()){
   try{await api('subirEvidencia',x,120000);await cola.quitar(x.id);enviadas++}
   catch(e){if(e.red) break; if(e.message==='SESION') throw e; await cola.quitar(x.id);toast('Una evidencia no se pudo guardar: '+e.message);enviadas++}
  }
  S.cola=await cola.todos();
  if(enviadas){toast(miCola().length?'Evidencias enviándose…':'Evidencia guardada en el servidor ✓');await sync()}
  pintarCola();
 }catch(e){if(e.message==='SESION'){salir();toast('Tu sesión terminó. Entra de nuevo; tu evidencia sigue guardada en este teléfono.')}}
 finally{enviando=false}
}

async function moverSemana(n){S.semana=n?mas(S.semana,7*n):lunes(new Date());const a=iso(S.semana),b=iso(mas(S.semana,6));
 if(a<S.rango.desde||b>S.rango.hasta){try{await cargar(S.semana)}catch(e){toast(e.message)}}pintar()}
const navSemana=()=>`<div class="fila"><button class="btn sec ch" onclick="moverSemana(-1)" aria-label="Semana anterior">${ic('izq')}</button><button class="btn sec ch" onclick="moverSemana(0)">Hoy</button><button class="btn sec ch" onclick="moverSemana(1)" aria-label="Semana siguiente">${ic('der')}</button><b class="serif" style="font-size:16px">${fechaTxt(iso(S.semana))} – ${fechaTxt(iso(mas(S.semana,6)))}</b></div>`;
const zonasVisibles=()=>[...new Set(S.personal.map(p=>p.zona).filter(Boolean))].sort();
function vAgenda(){
 const f=S.f,q=(f.q||'').toLowerCase();
 const sem=deSemana().filter(a=>(!f.zona||a.zona===f.zona)&&(!f.est||estado(a)===f.est)&&(!q||(a.titulo+a.asignadoNombre+a.lugar).toLowerCase().includes(q)));
 $('#vista').innerHTML=`<div class="filtros">${navSemana()}<span class="sp"></span>
  <input placeholder="Buscar…" value="${esc(f.q||'')}" onchange="S.f.q=this.value;vAgenda()">
  ${S.user.rol!=='encargado'?`<select onchange="S.f.zona=this.value;vAgenda()"><option value="">Todas las zonas</option>${zonasVisibles().map(z=>`<option ${f.zona===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}
  <select onchange="S.f.est=this.value;vAgenda()"><option value="">Todo estatus</option>${['Pendiente','Vencida','Con evidencia','Validada','Rechazada'].map(e=>`<option ${f.est===e?'selected':''}>${e}</option>`).join('')}</select>
  <button class="btn oro" onclick="planearIA()">${ic('ia')}Planear con IA</button><button class="btn" onclick="nuevaActividad()">${ic('mas')}Nueva actividad</button></div>
 <div class="semana">${dias7().map(d=>{const k=iso(d),l=sem.filter(a=>a.fecha===k).sort((a,b)=>a.hora.localeCompare(b.hora)),ab=S.f.abierto===k;
  return`<div class="col ${k===hoy()?'hoy':''}"><header><span>${d.toLocaleDateString('es-MX',{weekday:'long'})}</span><b>${d.getDate()}</b></header>
  ${(ab?l:l.slice(0,6)).map(a=>`<button class="chip e-${cls(estado(a))}" onclick="detalle('${a.id}')"><b>${a.hora?esc(a.hora)+' · ':''}${esc(a.titulo)}</b><span>${esc(a.asignadoNombre)}</span></button>`).join('')}
  ${l.length>6&&!ab?`<button class="mas" onclick="S.f.abierto='${k}';vAgenda()">+ ${l.length-6} más</button>`:''}${l.length?'':'<div class="mute sm" style="padding:4px">Sin actividades</div>'}</div>`}).join('')}</div>`;
}

function selector(){
 const u=S.user,gente=S.personal.filter(p=>p.estatus==='Activo'&&p.id!==u.id&&p.rol!=='admin');
 if(u.rol==='monitor') return '<p class="sm mute">La actividad se registra a tu nombre.</p>';
 return `<label>Asignar a *</label><div class="fila" style="margin-bottom:8px"><input id="selQ" placeholder="Buscar persona o zona…" oninput="filtrarSel()">
  <button class="btn sec ch" onclick="document.querySelectorAll('#selL label:not(.hide) input').forEach(i=>i.checked=true)">Todos</button></div>
  <div class="lista" id="selL">${gente.sort((a,b)=>(a.zona+a.nombre).localeCompare(b.zona+b.nombre)).map(p=>`<label data-t="${esc((p.nombre+' '+p.zona+' '+p.region+' '+ROL[p.rol]).toLowerCase())}"><input type="checkbox" value="${p.id}">${avatar(p)}<span class="sp">${esc(p.nombre)}<br><small class="mute">${ROL[p.rol]} · ${esc(p.zona||p.region||'')}</small></span></label>`).join('')||'<div class="vacio">Aún no hay personal activo.</div>'}</div>`;
}
function filtrarSel(){const q=val('selQ').toLowerCase();document.querySelectorAll('#selL label').forEach(l=>l.classList.toggle('hide',!l.dataset.t.includes(q)))}
const elegidos=()=>[...document.querySelectorAll('#selL input:checked')].map(i=>i.value);
function nuevaActividad(){
 modal(`<h2>Nueva actividad</h2>
 <div class="campo"><label>Título *</label><input id="aT" placeholder="Ej. Visitas de seguimiento en Villa Aldama"></div>
 <div class="dos"><div class="campo"><label>Tipo</label><select id="aTipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="campo"><label>Lugar</label><input id="aL"></div></div>
 <div class="dos"><div class="campo"><label>Fecha *</label><input id="aF" type="date" value="${hoy()}"></div><div class="campo"><label>Hora</label><input id="aH" type="time"></div></div>
 <div class="campo"><label>Indicaciones</label><textarea id="aD" rows="2"></textarea></div>
 <div class="campo">${selector()}</div>
 <button class="btn" style="width:100%" onclick="guardarActs(this,[{titulo:val('aT'),tipo:val('aTipo'),lugar:val('aL'),fecha:val('aF'),hora:val('aH'),descripcion:val('aD')}])">Guardar actividad</button>`);
}
function guardarActs(b,lista){ocupado(b,async()=>{
 if(lista.some(x=>!x.titulo||!x.fecha)) throw new Error('Falta el título o la fecha');
 const r=await api('guardarActividad',{actividades:lista,asignados:elegidos()});
 S.acts.push(...r.nuevas);cerrar();toast(r.nuevas.length===1?'Se creó 1 actividad':'Se crearon '+r.nuevas.length+' actividades');pintar()})}
function planearIA(){
 S.borr=[];
 modal(`<h2>${ic('ia')} Planear la semana con IA</h2><div class="ia"><label>Escribe o dicta tu plan tal como lo dirías</label>
 <textarea id="iaT" rows="4" placeholder="Ej. El martes a las 9 asamblea informativa en el parque de Tamulté; miércoles y jueves visitas domiciliarias en la colonia Gaviotas; viernes 10 am reunión de trabajo en la Delegación."></textarea>
 <button class="btn oro" style="margin-top:10px" onclick="pedirPlan(this)">${ic('ia')}Convertir en actividades</button></div>
 <div id="iaR" style="margin:14px 0"></div><div class="campo">${selector()}</div>
 <button class="btn" style="width:100%" onclick="guardarActs(this,S.borr)">Crear actividades</button>`,640);
}
function pedirPlan(b){ocupado(b,async()=>{S.borr=await api('ia',{tipo:'agenda',texto:val('iaT')});pintarPlan()})}
function pintarPlan(){$('#iaR').innerHTML=S.borr.map((x,i)=>`<div class="item"><div class="sp"><div class="t">${esc(x.titulo)}</div><div class="s">${esc(x.tipo)} · ${fechaTxt(x.fecha)} ${esc(x.hora||'')} · ${esc(x.lugar||'')}</div></div><button class="btn bad ch" onclick="S.borr.splice(${i},1);pintarPlan()">Quitar</button></div>`).join('')||'<p class="mute sm">Sin actividades propuestas.</p>'}

/* ═══════════ Detalle y evidencia ═══════════ */
function detalle(id){
 const a=S.acts.find(x=>x.id===id);if(!a)return;
 const e=S.evs.filter(x=>x.actividadId===id).pop(),vis=S.vis.filter(v=>v.actividadId===id&&(!e||v.evidenciaId===e.id)),mio=a.asignadoA===S.user.id,mando=jefe()||a.creadoPor===S.user.id;
 modal(`<h2>${esc(a.titulo)}</h2><div class="fila wrap" style="margin-bottom:12px">${badge(estado(a))}<span class="badge">${esc(a.tipo)}</span></div>
 <div class="meta">${ic('agenda')}${fechaTxt(a.fecha)}${a.hora?' · '+esc(a.hora):''}</div>
 <div class="meta">${ic('visitas')}${esc(a.lugar||'Sin lugar')} · ${esc(a.zona||a.region||'')}</div>
 <div class="meta">${ic('perfil')}Asignada a <b>${esc(a.asignadoNombre)}</b> · por ${esc(a.creadoNombre)}</div>
 ${a.descripcion?`<p style="margin:12px 0;padding:12px;background:var(--g50);border-radius:12px">${esc(a.descripcion)}</p>`:''}
 ${e?`<h3 class="serif" style="margin:16px 0 8px;font-size:16px">Evidencia</h3><div class="minis">${e.fotos.split(' | ').map(f=>`<img src="${esc(foto(f))}" alt="Evidencia" onclick="ampliar(this.src)">`).join('')}</div>
  <p style="margin:10px 0">${esc(e.comentario)}</p><p class="sm mute">Enviada ${esc(e.fecha)}${e.lat?` · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(e.lat+','+e.lng)}">Ver ubicación</a>`:''}${e.validadoPor?` · ${esc(e.validacion)} por ${esc(e.validadoPor)}`:''}</p>
  ${e.nota?`<p class="sm" style="color:var(--bad);margin-top:6px">Nota: ${esc(e.nota)}</p>`:''}<p class="sm" id="iaV" style="margin-top:6px;color:var(--info)">${esc(e.ia||'')}</p>
  ${vis.length?`<div class="tabla" style="margin-top:10px"><table><tr><th>Persona visitada</th><th>Programa</th><th>Resultado</th></tr>${vis.map(v=>`<tr><td><b>${esc(v.nombre)}</b><br><span class="sm mute">${esc(v.localidad)}</span></td><td>${esc(v.programa)}</td><td>${esc(v.resultado)}</td></tr>`).join('')}</table></div>`:''}`:''}
 <div class="fila wrap" style="margin-top:18px">
  ${mio&&['Pendiente','Rechazada'].includes(a.estatus)?`<button class="btn" onclick="formaEvidencia('${a.id}')">${ic('evidencias')}Subir evidencia</button>`:''}
  ${jefe()&&e&&e.validacion==='Por validar'?`<button class="btn ok" onclick="validar('${e.id}','Validada',this)">Validar</button><button class="btn bad" onclick="validar('${e.id}','Rechazada',this)">Rechazar</button>`:''}
  ${jefe()&&e?`<button class="btn oro" onclick="verificarIA('${e.id}',this)">${ic('ia')}Revisar con IA</button>`:''}
  ${mando&&!e?`<button class="btn sec" onclick="$('#repro').classList.toggle('hide')">Reprogramar</button><button class="btn bad" onclick="eliminarAct('${a.id}',this)">Eliminar</button>`:''}</div>
 <div id="repro" class="hide dos" style="margin-top:12px"><input type="date" id="rF" value="${a.fecha}"><div class="fila"><input type="time" id="rH" value="${esc(a.hora)}"><button class="btn" onclick="reprogramar('${a.id}',this)">Guardar</button></div></div>`,600);
}
function reprogramar(id){const a=S.acts.find(x=>x.id===id),f=val('rF'),h=val('rH');if(!a||!f)return;Object.assign(a,{fecha:f,hora:h});cerrar();pintar();toast('Actividad reprogramada');fondo(api('guardarActividad',{id,fecha:f,hora:h}))}
function eliminarAct(id){S.acts=S.acts.filter(a=>a.id!==id);cerrar();pintar();toast('Actividad eliminada');fondo(api('eliminarActividad',{id}))}
function validar(id,v){const e=S.evs.find(x=>x.id===id);if(!e)return;let nota='';
 if(v==='Rechazada'){nota=prompt('Motivo del rechazo (lo verá quien subió la evidencia):');if(nota===null)return}
 Object.assign(e,{validacion:v,validadoPor:S.user.nombre,nota});const a=S.acts.find(x=>x.id===e.actividadId);if(a)a.estatus=v;
 cerrar();pintar();toast('Evidencia '+v.toLowerCase());fondo(api('validarEvidencia',{id,validacion:v,nota}))}
function verificarIA(id,b){ocupado(b,async()=>{const r=await api('ia',{tipo:'verificar',id});const e=S.evs.find(x=>x.id===id);if(e)e.ia=r.ia;const p=$('#iaV');if(p)p.textContent=r.ia;else toast(r.ia)})}

function formaEvidencia(id){
 const a=S.acts.find(x=>x.id===id),esVisita=a.tipo.startsWith('Visita');S.fotos=[];S.geo=null;S.nv=0;
 modal(`<h2>Evidencia</h2><p class="mute" style="margin:-8px 0 14px">${esc(a.titulo)}</p>
 <div class="campo"><label>Fotos (hasta 4) *</label><div class="minis" id="eF"></div>
  <label class="btn sec" style="display:inline-flex;margin-top:8px">${ic('evidencias')}Agregar foto<input type="file" accept="image/*" multiple class="hide" onchange="agregarFotos(this)"></label></div>
 <div class="campo"><label>¿Qué se hizo?</label><textarea id="eC" rows="3" placeholder="Describe brevemente el resultado"></textarea></div>
 <p class="sm mute" id="eG" style="margin-bottom:12px">Obteniendo ubicación…</p>
 ${esVisita?`<h3 class="serif" style="font-size:16px;margin-bottom:8px">Personas visitadas</h3><div id="eV"></div><button class="btn sec ch" style="margin-bottom:14px" onclick="agregarVisita()">${ic('mas')}Agregar persona</button>`:''}
 <button class="btn" style="width:100%" onclick="enviarEvidencia('${id}',this)">Enviar evidencia</button>`,600);
 if(esVisita) agregarVisita();
 if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{S.geo=p.coords;const g=$('#eG');if(g)g.textContent='Ubicación registrada ✓'},()=>{const g=$('#eG');if(g)g.textContent='Sin ubicación (permiso no concedido).'},{enableHighAccuracy:true,timeout:9000});
 else $('#eG').textContent='';
}
async function agregarFotos(inp){for(const f of [...inp.files].slice(0,4-S.fotos.length)){try{S.fotos.push(await comprimir(f))}catch(e){toast(e.message)}}inp.value='';
 $('#eF').innerHTML=S.fotos.map((f,i)=>`<img src="${f}" alt="Foto ${i+1}" title="Tocar para quitar" onclick="S.fotos.splice(${i},1);this.remove()">`).join('')}
function agregarVisita(){const i=S.nv++;$('#eV').insertAdjacentHTML('beforeend',`<div class="visita" data-v><button class="x" onclick="this.parentNode.remove()" aria-label="Quitar">${ic('x')}</button>
 <div class="dos"><div class="campo"><label>Nombre completo *</label><input data-k="nombre"></div><div class="campo"><label>CURP</label><input data-k="curp" maxlength="18" style="text-transform:uppercase"></div></div>
 <div class="dos"><div class="campo"><label>Teléfono</label><input data-k="telefono" inputmode="tel"></div><div class="campo"><label>Localidad / colonia</label><input data-k="localidad"></div></div>
 <div class="campo"><label>Domicilio</label><input data-k="domicilio"></div>
 <div class="dos"><div class="campo"><label>Programa</label><select data-k="programa">${PROGRAMAS.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="campo"><label>Resultado</label><select data-k="resultado">${RESULTADOS.map(p=>`<option>${p}</option>`).join('')}</select></div></div>
 <div class="dos"><div class="campo" style="margin:0"><label>Motivo de la visita</label><input data-k="motivo"></div><div class="campo" style="margin:0"><label>Observaciones</label><input data-k="observaciones"></div></div></div>`)}
function enviarEvidencia(id,b){ocupado(b,async()=>{
 if(!S.fotos.length) throw new Error('Agrega al menos una foto');
 const visitas=[...document.querySelectorAll('[data-v]')].map(d=>Object.fromEntries([...d.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()]))).filter(v=>v.nombre);
 const x={id:('E'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)).toUpperCase(),uid:S.user.id,actividadId:id,fotos:S.fotos.slice(),comentario:val('eC'),
  lat:S.geo?String(S.geo.latitude):'',lng:S.geo?String(S.geo.longitude):'',visitas,cuando:hoy()+' '+new Date().toTimeString().slice(0,5)};
 if(DEMO){await api('subirEvidencia',x);cerrar();toast('Evidencia enviada. ¡Gracias!');await refrescar();return}
 let guardada=true;try{await cola.poner(x)}catch(e){guardada=false}
 if(!guardada){await api('subirEvidencia',x,120000);cerrar();toast('Evidencia enviada. ¡Gracias!');await refrescar();return}
 S.cola.push(x);aplicarCola();cerrar();pintar();
 toast(navigator.onLine?'Evidencia registrada. Enviando…':'Sin señal: la evidencia quedó guardada y se enviará sola al volver la conexión.');
 procesarCola()})}

/* ═══════════ Mis actividades ═══════════ */
function vTareas(){
 const mias=S.acts.filter(a=>a.asignadoA===S.user.id),t=S.tab;
 const l=mias.filter(a=>t==='Todas'||(t==='Pendientes'?['Pendiente','Rechazada'].includes(a.estatus):hecha(a))).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
 if(t!=='Pendientes') l.reverse();
 $('#vista').innerHTML=`<div class="filtros"><div class="tabs">${['Pendientes','Entregadas','Todas'].map(x=>`<button class="${t===x?'on':''}" onclick="S.tab='${x}';vTareas()">${x}</button>`).join('')}</div><span class="sp"></span>
  ${S.user.rol==='monitor'?`<button class="btn oro" onclick="planearIA()">${ic('ia')}Planear con IA</button><button class="btn" onclick="nuevaActividad()">${ic('mas')}Nueva actividad</button>`:''}</div>
 <div class="grid tarjetas">${l.map(a=>`<div class="card tarea"><div class="fila">${badge(estado(a))}<span class="sp"></span><span class="sm mute">${esc(a.tipo)}</span></div><h4>${esc(a.titulo)}</h4>
  <div class="meta">${ic('agenda')}${fechaTxt(a.fecha)}${a.hora?' · '+esc(a.hora):''}</div><div class="meta">${ic('visitas')}${esc(a.lugar||a.zona||'—')}</div>
  <div class="fila" style="margin-top:auto;padding-top:6px">${['Pendiente','Rechazada'].includes(a.estatus)?`<button class="btn sp" onclick="formaEvidencia('${a.id}')">${ic('evidencias')}Subir evidencia</button>`:''}<button class="btn sec ${hecha(a)?'sp':''}" onclick="detalle('${a.id}')">Ver</button></div></div>`).join('')}</div>
 ${l.length?'':'<div class="card vacio">No hay actividades en esta lista.</div>'}`;
}

/* ═══════════ Evidencias ═══════════ */
function vEvidencias(){
 const f=S.f,q=(f.q||'').toLowerCase();
 const l=S.evs.filter(e=>(!f.val||e.validacion===f.val)&&(!f.zona||e.zona===f.zona)&&(!q||(e.usuarioNombre+e.comentario).toLowerCase().includes(q))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('#vista').innerHTML=`<div class="filtros"><input placeholder="Buscar persona…" value="${esc(f.q||'')}" onchange="S.f.q=this.value;vEvidencias()">
  <select onchange="S.f.val=this.value;vEvidencias()"><option value="">Todas</option>${['Por validar','Validada','Rechazada'].map(e=>`<option ${f.val===e?'selected':''}>${e}</option>`).join('')}</select>
  ${S.user.rol!=='encargado'?`<select onchange="S.f.zona=this.value;vEvidencias()"><option value="">Todas las zonas</option>${zonasVisibles().map(z=>`<option ${f.zona===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}
  <span class="sp"></span><span class="mute sm">${l.length} evidencias</span></div>
 <div class="grid tarjetas">${l.slice(0,90).map(e=>{const a=S.acts.find(x=>x.id===e.actividadId)||{};return`<div class="card tarea" style="padding:12px"><img class="foto" loading="lazy" src="${esc(foto(e.fotos.split(' | ')[0]))}" alt="Evidencia" onclick="ampliar(this.src)">
  <div class="fila">${badge(e.validacion)}<span class="sp"></span><span class="sm mute">${esc(e.fecha.slice(0,10))}</span></div><h4>${esc(a.titulo||'Actividad')}</h4>
  <div class="meta">${ic('perfil')}${esc(e.usuarioNombre)} · ${esc(e.zona)}</div><button class="btn sec" onclick="detalle('${e.actividadId}')">Revisar</button></div>`}).join('')}</div>
 ${l.length?'':'<div class="card vacio">Aún no hay evidencias.</div>'}`;
}

/* ═══════════ Visitas ═══════════ */
function vVisitas(){
 const q=(S.f.q||'').toLowerCase(),l=S.vis.filter(v=>!q||(v.nombre+v.localidad+v.servidorNombre+v.programa).toLowerCase().includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('#vista').innerHTML=`<div class="filtros"><input placeholder="Buscar nombre, localidad, programa…" value="${esc(S.f.q||'')}" onchange="S.f.q=this.value;vVisitas()"><span class="sp"></span><span class="mute sm">${l.length} personas</span>
  <button class="btn" onclick="excel('Visitas',this)">${ic('reportes')}Excel</button></div>
 <div class="card tabla"><table><tr><th>Fecha</th><th>Persona visitada</th><th>Localidad</th><th>Programa</th><th>Resultado</th><th>Servidor</th></tr>
 ${l.slice(0,300).map(v=>`<tr><td class="sm">${esc(v.fecha)}</td><td><b>${esc(v.nombre)}</b><br><span class="sm mute">${esc(v.telefono)}</span></td><td>${esc(v.localidad)}<br><span class="sm mute">${esc(v.zona)}</span></td><td>${esc(v.programa)}</td><td>${badge(v.resultado).replace('b-','x-')}</td><td class="sm">${esc(v.servidorNombre)}</td></tr>`).join('')||'<tr><td colspan="6" class="vacio">Aún no hay visitas registradas.</td></tr>'}</table></div>`;
}

/* ═══════════ Personal ═══════════ */
const enlace=(v,base)=>/^https?:\/\//.test(v)?v:base+String(v).replace(/^@/,'');
function tarjetaPersona(p){const yo=S.user,gest=yo.rol==='admin'||(yo.rol==='regional'&&['encargado','servidor'].includes(p.rol))||(yo.rol==='encargado'&&p.rol==='servidor');
 return`<div class="card persona">${avatar(p,'g')}<h4>${esc(p.nombre)}</h4><div class="fila wrap" style="justify-content:center"><span class="badge">${ROL[p.rol]}</span>${p.estatus!=='Activo'?badge(p.estatus):''}</div>
 <div class="sm mute">${esc(p.zona||p.region||'Estatal')}</div>${yo.rol!=='encargado'||gest?`<div class="sm mute">${esc(p.curp)}</div>`:''}
